<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Radius</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: rgb(9 9 11);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .box {
      height: 80px;
      background: rgb(63 63 70);
      border: 1px solid rgb(113 113 122);
    }
    .label {
      font-size: 13px;
      color: rgb(212 212 216);
      font-weight: 500;
    }
    .value {
      font-size: 11px;
      color: rgb(113 113 122);
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="item">
      <div class="box" style="border-radius: 4px;"></div>
      <div class="label">radius-sm</div>
      <div class="value">4px</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: 6px;"></div>
      <div class="label">radius-md</div>
      <div class="value">6px</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: 8px;"></div>
      <div class="label">radius-lg</div>
      <div class="value">8px</div>
    </div>
    <div class="item">
      <div class="box" style="border-radius: 9999px;"></div>
      <div class="label">radius-full</div>
      <div class="value">9999px</div>
    </div>
  </div>
</body>
</html>
