<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing System</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: rgb(9 9 11);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .box {
      background: rgb(37 99 235);
      height: 32px;
    }
    .label {
      font-size: 13px;
      color: rgb(212 212 216);
      font-weight: 500;
      min-width: 80px;
    }
    .value {
      font-size: 11px;
      color: rgb(113 113 122);
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="stack">
    <div class="item">
      <div class="label">space-1</div>
      <div class="box" style="width: 4px;"></div>
      <div class="value">4px / 0.25rem</div>
    </div>
    <div class="item">
      <div class="label">space-1.5</div>
      <div class="box" style="width: 6px;"></div>
      <div class="value">6px / 0.375rem</div>
    </div>
    <div class="item">
      <div class="label">space-2</div>
      <div class="box" style="width: 8px;"></div>
      <div class="value">8px / 0.5rem</div>
    </div>
    <div class="item">
      <div class="label">space-3</div>
      <div class="box" style="width: 12px;"></div>
      <div class="value">12px / 0.75rem</div>
    </div>
    <div class="item">
      <div class="label">space-4</div>
      <div class="box" style="width: 16px;"></div>
      <div class="value">16px / 1rem</div>
    </div>
    <div class="item">
      <div class="label">space-6</div>
      <div class="box" style="width: 24px;"></div>
      <div class="value">24px / 1.5rem</div>
    </div>
    <div class="item">
      <div class="label">space-8</div>
      <div class="box" style="width: 32px;"></div>
      <div class="value">32px / 2rem</div>
    </div>
    <div class="item">
      <div class="label">space-12</div>
      <div class="box" style="width: 48px;"></div>
      <div class="value">48px / 3rem</div>
    </div>
  </div>
</body>
</html>
