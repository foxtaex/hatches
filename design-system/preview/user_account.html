<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Account View</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: system-ui, -apple-system, sans-serif;
      background: rgb(9 9 11);
      color: rgb(244 244 245);
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;
    
    function UserAccountView() {
      const [user, setUser] = useState({
        displayName: 'Max Mustermann',
        username: 'maxmustermann',
        email: 'max@example.com',
        avatarUrl: null,
        teams: [
          { id: 1, name: 'Development', color: '#3b82f6', role: 'Developer' },
          { id: 2, name: 'Design', color: '#22c55e', role: 'Reviewer' },
          { id: 3, name: 'Product', color: '#a855f7', role: 'Member' }
        ]
      });
      
      const [editing, setEditing] = useState(false);
      const [editForm, setEditForm] = useState({
        displayName: user.displayName,
        email: user.email
      });
      
      const [avatarHover, setAvatarHover] = useState(false);
      
      const containerStyles = {
        maxWidth: '800px',
        margin: '0 auto',
        background: 'rgb(24 24 27)',
        borderRadius: '16px',
        padding: '32px',
        boxShadow: '0 4px 16px rgba(0, 0, 0, 0.3)'
      };
      
      const headerStyles = {
        display: 'flex',
        alignItems: 'center',
        gap: '24px',
        marginBottom: '32px',
        paddingBottom: '24px',
        borderBottom: '1px solid rgb(39 39 42)'
      };
      
      const avatarContainerStyles = {
        position: 'relative',
        cursor: 'pointer'
      };
      
      const avatarStyles = {
        width: '120px',
        height: '120px',
        borderRadius: '50%',
        background: 'linear-gradient(135deg, rgb(99 102 241) 0%, rgb(139 92 246) 100%)',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        fontSize: '48px',
        fontWeight: 700,
        color: 'white',
        boxShadow: '0 4px 12px rgba(139, 92, 246, 0.4)',
        transition: 'transform 200ms ease'
      };
      
      const avatarOverlayStyles = {
        position: 'absolute',
        top: 0,
        left: 0,
        right: 0,
        bottom: 0,
        borderRadius: '50%',
        background: 'rgba(0, 0, 0, 0.6)',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        opacity: avatarHover ? 1 : 0,
        transition: 'opacity 200ms ease'
      };
      
      const sectionStyles = {
        marginBottom: '24px'
      };
      
      const labelStyles = {
        fontSize: '12px',
        fontWeight: 600,
        color: 'rgb(161 161 170)',
        textTransform: 'uppercase',
        letterSpacing: '0.05em',
        marginBottom: '8px'
      };
      
      const valueStyles = {
        fontSize: '16px',
        color: 'rgb(244 244 245)'
      };
      
      const inputStyles = {
        width: '100%',
        background: 'rgb(39 39 42)',
        border: '1px solid rgb(63 63 70)',
        color: 'rgb(244 244 245)',
        borderRadius: '8px',
        padding: '12px',
        fontSize: '14px',
        outline: 'none',
        transition: 'border-color 200ms'
      };
      
      const buttonStyles = {
        padding: '10px 20px',
        borderRadius: '12px',
        fontSize: '14px',
        fontWeight: 600,
        border: 'none',
        cursor: 'pointer',
        transition: 'all 200ms ease',
        display: 'flex',
        alignItems: 'center',
        gap: '6px'
      };
      
      const primaryButtonStyles = {
        ...buttonStyles,
        background: 'linear-gradient(135deg, rgb(59 130 246) 0%, rgb(37 99 235) 100%)',
        color: 'white',
        boxShadow: '0 2px 8px rgba(59, 130, 246, 0.4)'
      };
      
      const secondaryButtonStyles = {
        ...buttonStyles,
        background: 'rgba(255, 255, 255, 0.05)',
        color: 'rgb(161 161 170)',
        border: '1px solid rgba(255, 255, 255, 0.1)'
      };
      
      const teamBadgeStyles = (color) => ({
        display: 'inline-flex',
        alignItems: 'center',
        gap: '8px',
        padding: '8px 16px',
        borderRadius: '12px',
        background: 'rgb(39 39 42)',
        border: '2px solid ' + color,
        fontSize: '14px',
        fontWeight: 500
      });
      
      const handleSave = () => {
        setUser({ ...user, ...editForm });
        setEditing(false);
      };
      
      return (
        <div style={containerStyles}>
          <div style={headerStyles}>
            <div 
              style={avatarContainerStyles}
              onMouseEnter={() => setAvatarHover(true)}
              onMouseLeave={() => setAvatarHover(false)}
            >
              <div style={avatarStyles}>
                {user.displayName.charAt(0).toUpperCase()}
              </div>
              <div style={avatarOverlayStyles}>
                <i className="fa-solid fa-camera" style={{ fontSize: '24px', color: 'white' }}></i>
              </div>
            </div>
            
            <div style={{ flex: 1 }}>
              <h1 style={{ fontSize: '28px', fontWeight: 700, margin: '0 0 4px 0' }}>
                {user.displayName}
              </h1>
              <p style={{ fontSize: '16px', color: 'rgb(161 161 170)', margin: 0 }}>
                @{user.username}
              </p>
            </div>
            
            {!editing && (
              <button 
                onClick={() => setEditing(true)}
                style={primaryButtonStyles}
                onMouseEnter={e => {
                  e.currentTarget.style.transform = 'translateY(-2px)';
                  e.currentTarget.style.boxShadow = '0 4px 12px rgba(59, 130, 246, 0.5)';
                }}
                onMouseLeave={e => {
                  e.currentTarget.style.transform = 'translateY(0)';
                  e.currentTarget.style.boxShadow = '0 2px 8px rgba(59, 130, 246, 0.4)';
                }}
              >
                <i className="fa-solid fa-pen"></i>
                Bearbeiten
              </button>
            )}
          </div>
          
          {editing ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <div style={sectionStyles}>
                <div style={labelStyles}>Anzeigename</div>
                <input 
                  type="text"
                  value={editForm.displayName}
                  onChange={e => setEditForm({ ...editForm, displayName: e.target.value })}
                  style={inputStyles}
                  onFocus={e => e.target.style.borderColor = 'rgb(113 113 122)'}
                  onBlur={e => e.target.style.borderColor = 'rgb(63 63 70)'}
                />
              </div>
              
              <div style={sectionStyles}>
                <div style={labelStyles}>E-Mail</div>
                <input 
                  type="email"
                  value={editForm.email}
                  onChange={e => setEditForm({ ...editForm, email: e.target.value })}
                  style={inputStyles}
                  onFocus={e => e.target.style.borderColor = 'rgb(113 113 122)'}
                  onBlur={e => e.target.style.borderColor = 'rgb(63 63 70)'}
                />
              </div>
              
              <div style={{ display: 'flex', gap: '12px', paddingTop: '12px' }}>
                <button 
                  onClick={handleSave}
                  style={primaryButtonStyles}
                  onMouseEnter={e => {
                    e.currentTarget.style.transform = 'translateY(-2px)';
                    e.currentTarget.style.boxShadow = '0 4px 12px rgba(59, 130, 246, 0.5)';
                  }}
                  onMouseLeave={e => {
                    e.currentTarget.style.transform = 'translateY(0)';
                    e.currentTarget.style.boxShadow = '0 2px 8px rgba(59, 130, 246, 0.4)';
                  }}
                >
                  <i className="fa-solid fa-check"></i>
                  Speichern
                </button>
                <button 
                  onClick={() => {
                    setEditForm({ displayName: user.displayName, email: user.email });
                    setEditing(false);
                  }}
                  style={secondaryButtonStyles}
                  onMouseEnter={e => {
                    e.currentTarget.style.background = 'rgba(255, 255, 255, 0.1)';
                    e.currentTarget.style.color = 'rgb(244 244 245)';
                  }}
                  onMouseLeave={e => {
                    e.currentTarget.style.background = 'rgba(255, 255, 255, 0.05)';
                    e.currentTarget.style.color = 'rgb(161 161 170)';
                  }}
                >
                  <i className="fa-solid fa-xmark"></i>
                  Abbrechen
                </button>
              </div>
            </div>
          ) : (
            <>
              <div style={sectionStyles}>
                <div style={labelStyles}>Benutzername</div>
                <div style={valueStyles}>@{user.username}</div>
              </div>
              
              <div style={sectionStyles}>
                <div style={labelStyles}>E-Mail</div>
                <div style={valueStyles}>{user.email}</div>
              </div>
              
              <div style={{ ...sectionStyles, paddingTop: '12px', borderTop: '1px solid rgb(39 39 42)' }}>
                <div style={{ ...labelStyles, marginBottom: '12px' }}>Teams & Rollen</div>
                <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                  {user.teams.map(team => (
                    <div key={team.id} style={teamBadgeStyles(team.color)}>
                      <div style={{ width: '8px', height: '8px', borderRadius: '50%', background: team.color }}></div>
                      <span style={{ color: 'rgb(244 244 245)' }}>{team.name}</span>
                      <span style={{ color: 'rgb(113 113 122)', fontSize: '12px' }}>• {team.role}</span>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }
    
    ReactDOM.render(<UserAccountView />, document.getElementById('root'));
  </script>
</body>
</html>
