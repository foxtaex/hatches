<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hatches UI Kit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    body { 
      margin: 0; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #000;
    }
    
    /* Apple-style scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
      background-clip: padding-box;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel" src="Navigation.jsx"></script>
  <script type="text/babel" src="KanbanBoard.jsx"></script>
  <script type="text/babel" src="DocsEditor.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    
    // UserAccount component inline
    function UserAccount() {
      const [user, setUser] = useState({
        id: 1,
        username: 'foxtaex',
        displayName: 'foxtaex',
        email: 'foxtaex@example.com',
        avatar: null,
        teams: [
          { id: 1, name: 'Design', color: '#22c55e', role: 'Member' },
          { id: 2, name: 'Development', color: '#3b82f6', role: 'Admin' }
        ]
      });
      
      const [editing, setEditing] = useState(false);
      const [editedName, setEditedName] = useState(user.displayName);
      const [editedEmail, setEditedEmail] = useState(user.email);
      
      const saveChanges = () => {
        setUser({ ...user, displayName: editedName, email: editedEmail });
        setEditing(false);
      };
      
      return (
        <div style={{ flex: 1, overflow: 'auto', background: 'rgb(9 9 11)' }}>
          <div style={{ maxWidth: '800px', margin: '0 auto', padding: '48px 32px' }}>
            <div style={{ background: 'rgb(24 24 27)', borderRadius: '12px', border: '1px solid rgb(39 39 42)', padding: '32px', marginBottom: '24px' }}>
              <div style={{ display: 'flex', gap: '24px', alignItems: 'flex-start' }}>
                <div style={{ position: 'relative' }}>
                  <div style={{ width: '120px', height: '120px', borderRadius: '50%', background: 'rgb(63 63 70)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '48px', fontWeight: 700, color: 'rgb(212 212 216)', border: '3px solid rgb(39 39 42)' }}>
                    {user.displayName.charAt(0).toUpperCase()}
                  </div>
                </div>
                <div style={{ flex: 1 }}>
                  <h1 style={{ fontSize: '32px', fontWeight: 700, margin: '0 0 4px 0', color: 'rgb(244 244 245)' }}>
                    {user.displayName}
                  </h1>
                  <p style={{ fontSize: '16px', color: 'rgb(113 113 122)', margin: '0 0 20px 0' }}>
                    @{user.username}
                  </p>
                  <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '20px' }}>
                    {user.teams.map(team => (
                      <div key={team.id} style={{ display: 'flex', alignItems: 'center', gap: '6px', padding: '6px 12px', borderRadius: '8px', background: team.color + '22', border: '1px solid ' + team.color + '44', fontSize: '13px', fontWeight: 600 }}>
                        <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: team.color }}></span>
                        <span style={{ color: team.color }}>{team.name}</span>
                      </div>
                    ))}
                  </div>
                  <button
                    onClick={() => setEditing(!editing)}
                    style={{
                      background: editing ? 'transparent' : 'linear-gradient(135deg, #3b82f6 0%, #1e40af 100%)',
                      color: 'white',
                      border: editing ? '1px solid rgb(63 63 70)' : 'none',
                      borderRadius: '12px',
                      padding: '10px 20px',
                      fontSize: '14px',
                      fontWeight: 600,
                      cursor: 'pointer',
                      display: 'flex',
                      alignItems: 'center',
                      gap: '8px',
                      boxShadow: editing ? 'none' : '0 4px 14px rgba(59, 130, 246, 0.4)',
                      transition: 'all 200ms'
                    }}
                  >
                    <i className={`fa-solid fa-${editing ? 'xmark' : 'pen'}`}></i>
                    {editing ? 'Abbrechen' : 'Profil bearbeiten'}
                  </button>
                </div>
              </div>
            </div>
            <div style={{ background: 'rgb(24 24 27)', borderRadius: '12px', border: '1px solid rgb(39 39 42)', padding: '24px' }}>
              <h2 style={{ fontSize: '20px', fontWeight: 600, margin: '0 0 20px 0', color: 'rgb(244 244 245)' }}>
                Account-Einstellungen
              </h2>
              <div style={{ display: 'grid', gap: '20px' }}>
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: 600, color: 'rgb(212 212 216)', marginBottom: '8px' }}>
                    Anzeigename
                  </label>
                  <input value={editedName} onChange={e => setEditedName(e.target.value)} disabled={!editing} style={{ width: '100%', background: editing ? 'rgb(39 39 42)' : 'rgb(24 24 27)', border: '1px solid rgb(63 63 70)', color: 'rgb(244 244 245)', borderRadius: '8px', padding: '10px 12px', fontSize: '14px', outline: 'none' }} />
                </div>
                <div>
                  <label style={{ display: 'block', fontSize: '13px', fontWeight: 600, color: 'rgb(212 212 216)', marginBottom: '8px' }}>
                    E-Mail
                  </label>
                  <input type="email" value={editedEmail} onChange={e => setEditedEmail(e.target.value)} disabled={!editing} style={{ width: '100%', background: editing ? 'rgb(39 39 42)' : 'rgb(24 24 27)', border: '1px solid rgb(63 63 70)', color: 'rgb(244 244 245)', borderRadius: '8px', padding: '10px 12px', fontSize: '14px', outline: 'none' }} />
                </div>
                {editing && (
                  <button onClick={saveChanges} style={{ background: 'linear-gradient(135deg, #3b82f6 0%, #1e40af 100%)', color: 'white', border: 'none', borderRadius: '12px', padding: '12px 24px', fontSize: '14px', fontWeight: 600, cursor: 'pointer' }}>
                    Speichern
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }
    
    // AdminSettings component inline
    function AdminSettings() {
      return (
        <div style={{ flex: 1, overflow: 'auto', background: 'rgb(9 9 11)' }}>
          <div style={{ maxWidth: '900px', margin: '0 auto', padding: '32px' }}>
            <h1 style={{ fontSize: '28px', fontWeight: 700, margin: '0 0 32px 0', color: 'rgb(244 244 245)' }}>
              Admin Settings
            </h1>
            <div style={{ background: 'rgb(24 24 27)', borderRadius: '12px', border: '1px solid rgb(39 39 42)', padding: '24px' }}>
              <p style={{ color: 'rgb(161 161 170)' }}>Admin-Einstellungen werden hier angezeigt...</p>
            </div>
          </div>
        </div>
      );
    }
    
    // Wait for all components to load
    function App() {
      const [view, setView] = useState('board');
      
      return (
        <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh', background: '#000', color: 'rgba(255, 255, 255, 0.95)' }}>
          <Navigation active={view} onNavigate={setView} currentUser={{ username: 'foxtaex', displayName: 'foxtaex', isAdmin: true }} />
          
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: '#000' }}>
            {view === 'board' && <KanbanBoard />}
            {view === 'docs' && <DocsEditor />}
            {view === 'notes' && (
              <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'rgb(113 113 122)', fontSize: '14px' }}>
                Notes view (placeholder)
              </div>
            )}
            {view === 'websites' && (
              <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'rgb(113 113 122)', fontSize: '14px' }}>
                Websites view (placeholder)
              </div>
            )}
            {view === 'integrations' && (
              <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'rgb(113 113 122)', fontSize: '14px' }}>
                Integrations view (placeholder)
              </div>
            )}
            {view === 'admin' && <AdminSettings />}
            {view === 'user' && <UserAccount />}
          </main>
        </div>
      );
    }
    
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
