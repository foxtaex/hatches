<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hatches — Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0a0c0e; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
  .logo-card { width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
  .caption {
    position:absolute; left:24px; bottom:20px;
    font-family:'JetBrains Mono', monospace; font-size:11px;
    color: rgba(255,255,255,0.45); letter-spacing: 0.02em;
  }
  .caption .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#3CC79A; margin-right:8px; vertical-align:middle; }
  .caption .name { color:rgba(255,255,255,0.78); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
const { DCArtboard, DCSection, DesignCanvas } = window;

// ──────────────────────────────────────────────────────────────────────────
// Shared bits
// ──────────────────────────────────────────────────────────────────────────
const Caption = ({ tag, name }) => (
  <div className="caption"><span className="dot" />{tag} · <span className="name">{name}</span></div>
);

const WordmarkText = ({size = 64, color = '#f5f5f7', dotSize = null}) => {
  const ds = dotSize ?? Math.round(size * 0.16);
  return (
    <div style={{display:'flex', alignItems:'baseline'}}>
      <span style={{
        fontFamily:'Inter, -apple-system, sans-serif',
        fontWeight:600, fontSize:size, letterSpacing:'-0.045em', color, lineHeight:1,
      }}>hatches</span>
      <span style={{
        width:ds, height:ds, borderRadius:'50%',
        background:'linear-gradient(135deg,#7CE3B3,#1e8e74)',
        marginLeft: Math.round(size * 0.08),
        marginBottom: Math.round(size * 0.10),
        alignSelf:'flex-end',
        boxShadow:'0 0 28px rgba(60,199,154,0.6)',
        display:'inline-block',
      }} />
    </div>
  );
};

// ──────────────────────────────────────────────────────────────────────────
// MARK A — Vivid: mint squircle, white H, perspective crossbar lid
// ──────────────────────────────────────────────────────────────────────────
const MarkA = ({ size = 280, uid = 'a' }) => {
  const gm = `ma-${uid}-m`, gl = `ma-${uid}-l`;
  return (
    <svg width={size} height={size} viewBox="0 0 280 280">
      <defs>
        <linearGradient id={gm} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stopColor="#3CC79A"/>
          <stop offset="100%" stopColor="#138A6E"/>
        </linearGradient>
        <linearGradient id={gl} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stopColor="#aef0d2"/>
          <stop offset="100%" stopColor="#3CC79A"/>
        </linearGradient>
      </defs>
      <path d="M 64 20 Q 20 20 20 64 L 20 216 Q 20 260 64 260 L 216 260 Q 260 260 260 216 L 260 64 Q 260 20 216 20 Z"
            fill={`url(#${gm})`}/>
      <g fill="#ffffff">
        <rect x="74" y="66" width="32" height="148" rx="5"/>
        <rect x="174" y="66" width="32" height="148" rx="5"/>
      </g>
      <polygon points="74,158 206,142 206,150 74,168" fill="#0a3b2e" opacity="0.18"/>
      <polygon points="74,128 206,112 206,140 74,156" fill={`url(#${gl})`}/>
      <polygon points="74,128 206,112 206,116 74,132" fill="#ffffff" opacity="0.35"/>
    </svg>
  );
};

// ──────────────────────────────────────────────────────────────────────────
// MARK B — Subtle: dark squircle, glowing mint H
// ──────────────────────────────────────────────────────────────────────────
const MarkB = ({ size = 280, uid = 'b' }) => {
  const gm = `mb-${uid}-m`, gl = `mb-${uid}-l`, gf = `mb-${uid}-f`;
  return (
    <svg width={size} height={size} viewBox="0 0 280 280">
      <defs>
        <linearGradient id={gm} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stopColor="#1a3f33"/>
          <stop offset="100%" stopColor="#0e2620"/>
        </linearGradient>
        <linearGradient id={gl} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stopColor="#7CE3B3"/>
          <stop offset="100%" stopColor="#3CC79A"/>
        </linearGradient>
        <filter id={gf} x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation={Math.max(3, size/50)}/>
        </filter>
      </defs>
      <path d="M 64 20 Q 20 20 20 64 L 20 216 Q 20 260 64 260 L 216 260 Q 260 260 260 216 L 260 64 Q 260 20 216 20 Z"
            fill={`url(#${gm})`} stroke="#23574a" strokeWidth="1"/>
      <g filter={`url(#${gf})`} opacity="0.85">
        <rect x="74" y="66" width="32" height="148" rx="5" fill="#3CC79A"/>
        <rect x="174" y="66" width="32" height="148" rx="5" fill="#3CC79A"/>
        <polygon points="74,128 206,112 206,140 74,156" fill="#3CC79A"/>
      </g>
      <g fill="#7CE3B3">
        <rect x="74" y="66" width="32" height="148" rx="5"/>
        <rect x="174" y="66" width="32" height="148" rx="5"/>
      </g>
      <polygon points="74,158 206,142 206,150 74,168" fill="#000" opacity="0.35"/>
      <polygon points="74,128 206,112 206,140 74,156" fill={`url(#${gl})`}/>
      <polygon points="74,128 206,112 206,116 74,132" fill="#ffffff" opacity="0.25"/>
    </svg>
  );
};

// ──────────────────────────────────────────────────────────────────────────
// MARK C — Outline: neon-edge silhouette
// ──────────────────────────────────────────────────────────────────────────
const MarkC = ({ size = 280, uid = 'c' }) => {
  const gl = `mc-${uid}-l`, gf = `mc-${uid}-f`;
  const sw = Math.max(2, Math.round(size / 80) + 1);
  return (
    <svg width={size} height={size} viewBox="0 0 280 280">
      <defs>
        <linearGradient id={gl} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stopColor="#7CE3B3"/>
          <stop offset="100%" stopColor="#3CC79A"/>
        </linearGradient>
        <filter id={gf} x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation={Math.max(2, size/80)}/>
        </filter>
      </defs>
      <g filter={`url(#${gf})`} opacity="0.55">
        <path d="M 64 20 Q 20 20 20 64 L 20 216 Q 20 260 64 260 L 216 260 Q 260 260 260 216 L 260 64 Q 260 20 216 20 Z"
              fill="none" stroke="#3CC79A" strokeWidth={sw + 2}/>
      </g>
      <path d="M 64 20 Q 20 20 20 64 L 20 216 Q 20 260 64 260 L 216 260 Q 260 260 260 216 L 260 64 Q 260 20 216 20 Z"
            fill="none" stroke="#3CC79A" strokeWidth={sw}/>
      <g fill="none" stroke="#3CC79A" strokeWidth={sw} strokeLinejoin="round">
        <rect x="74" y="66" width="32" height="148" rx="5"/>
        <rect x="174" y="66" width="32" height="148" rx="5"/>
      </g>
      <polygon points="74,128 206,112 206,140 74,156" fill={`url(#${gl})`}/>
      <polygon points="74,128 206,112 206,116 74,132" fill="#ffffff" opacity="0.3"/>
    </svg>
  );
};

// ──────────────────────────────────────────────────────────────────────────
// Card factory — same composition for each treatment
// ──────────────────────────────────────────────────────────────────────────
const makeCards = (Mark, label) => ({
  Hero: () => (
    <div className="logo-card" style={{background:'#0b0d0f'}}>
      <Mark size={360} uid={`${label}-hero`}/>
      <Caption tag={`★ ${label}`} name="Primary mark" />
    </div>
  ),
  Lockup: () => (
    <div className="logo-card" style={{background:'#0b0d0f'}}>
      <div style={{display:'flex', alignItems:'center', gap:28}}>
        <Mark size={132} uid={`${label}-lk`}/>
        <WordmarkText size={88}/>
      </div>
      <Caption tag="a" name="Lockup — horizontal" />
    </div>
  ),
  Compact: () => (
    <div className="logo-card" style={{background:'#0b0d0f'}}>
      <div style={{display:'flex', alignItems:'center', gap:14}}>
        <Mark size={44} uid={`${label}-cp`}/>
        <WordmarkText size={30}/>
      </div>
      <Caption tag="b" name="Compact — nav / sidebar" />
    </div>
  ),
  Sizes: () => (
    <div className="logo-card" style={{background:'#0b0d0f', flexDirection:'column', gap:24}}>
      <div style={{display:'flex', alignItems:'flex-end', gap:24}}>
        <Mark size={128} uid={`${label}-s1`}/>
        <Mark size={64}  uid={`${label}-s2`}/>
        <Mark size={32}  uid={`${label}-s3`}/>
        <Mark size={16}  uid={`${label}-s4`}/>
      </div>
      <Caption tag="c" name="128 / 64 / 32 / 16 px" />
    </div>
  ),
  InContext: () => (
    <div className="logo-card" style={{background:'#0b0d0f', padding:24, alignItems:'stretch'}}>
      <div style={{
        flex:1, borderRadius:14, border:'1px solid #1c1f23', background:'#0f1316',
        display:'flex', overflow:'hidden'
      }}>
        <div style={{width:200, borderRight:'1px solid #1c1f23', padding:18, display:'flex', flexDirection:'column', gap:18}}>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <Mark size={28} uid={`${label}-ic`}/>
            <span style={{fontFamily:'Inter', fontWeight:600, fontSize:18, color:'#f5f5f7', letterSpacing:'-0.025em'}}>hatches</span>
          </div>
          <div style={{display:'flex', flexDirection:'column', gap:8, marginTop:6}}>
            {['Inbox','Today','Notes','Repos','Team'].map((l,i) => (
              <div key={l} style={{
                fontFamily:'Inter', fontSize:13, color: i===0 ? '#f5f5f7':'#7d8089',
                padding:'6px 10px', borderRadius:6,
                background: i===0 ? 'rgba(60,199,154,0.10)':'transparent'
              }}>{l}</div>
            ))}
          </div>
        </div>
        <div style={{flex:1, padding:24, display:'flex', flexDirection:'column', gap:10}}>
          <div style={{fontFamily:'Inter', fontSize:11, color:'#7d8089', letterSpacing:'0.08em', textTransform:'uppercase'}}>Today</div>
          <div style={{fontFamily:'Inter', fontSize:26, color:'#f5f5f7', letterSpacing:'-0.03em', fontWeight:600}}>API rewrite — sync layer</div>
          <div style={{height:1, background:'#1c1f23', margin:'8px 0'}} />
          <div style={{fontFamily:'Inter', fontSize:13, color:'#a8aab0', lineHeight:1.55}}>
            Sketches from Notion. Pulled in spec from /repos/sync.
          </div>
        </div>
      </div>
      <Caption tag={`· ${label}`} name="In-product context" />
    </div>
  ),
});

const A = makeCards(MarkA, 'A');
const B = makeCards(MarkB, 'B');
const C = makeCards(MarkC, 'C');

// ──────────────────────────────────────────────────────────────────────────
// Canvas
// ──────────────────────────────────────────────────────────────────────────
const Section = ({ id, title, cards }) => (
  <DCSection id={id} title={title}>
    <DCArtboard id={`${id}-hero`} label="Hero"        width={460} height={460}><cards.Hero /></DCArtboard>
    <DCArtboard id={`${id}-lock`} label="Lockup"      width={720} height={300}><cards.Lockup /></DCArtboard>
    <DCArtboard id={`${id}-cmp`}  label="Compact"     width={420} height={200}><cards.Compact /></DCArtboard>
    <DCArtboard id={`${id}-siz`}  label="Sizes"       width={560} height={300}><cards.Sizes /></DCArtboard>
    <DCArtboard id={`${id}-ctx`}  label="In-product"  width={720} height={420}><cards.InContext /></DCArtboard>
  </DCSection>
);

const App = () => (
  <DesignCanvas title="Hatches — Logo" subtitle="Three dark-mode treatments: A Vivid · B Subtle · C Outline">
    <Section id="A" title="A · Vivid — mint squircle, white H"   cards={A}/>
    <Section id="B" title="B · Subtle — dark squircle, glowing H" cards={B}/>
    <Section id="C" title="C · Outline — neon-edge stroke"        cards={C}/>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
