<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primary Colors</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: rgb(9 9 11);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .color {
      height: 64px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .label {
      font-size: 13px;
      color: rgb(212 212 216);
      font-weight: 500;
    }
    .value {
      font-size: 11px;
      color: rgb(113 113 122);
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="swatch">
      <div class="color" style="background: rgb(9 9 11);"></div>
      <div class="label">zinc-950</div>
      <div class="value">rgb(9 9 11)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(24 24 27);"></div>
      <div class="label">zinc-900</div>
      <div class="value">rgb(24 24 27)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(39 39 42);"></div>
      <div class="label">zinc-800</div>
      <div class="value">rgb(39 39 42)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(63 63 70);"></div>
      <div class="label">zinc-700</div>
      <div class="value">rgb(63 63 70)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(82 82 91);"></div>
      <div class="label">zinc-600</div>
      <div class="value">rgb(82 82 91)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(113 113 122);"></div>
      <div class="label">zinc-500</div>
      <div class="value">rgb(113 113 122)</div>
    </div>
  </div>
</body>
</html>
