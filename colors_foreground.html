<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foreground Colors</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: rgb(9 9 11);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .swatch {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .color {
      height: 64px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .label {
      font-size: 13px;
      color: rgb(212 212 216);
      font-weight: 500;
    }
    .value {
      font-size: 11px;
      color: rgb(113 113 122);
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="swatch">
      <div class="color" style="background: rgb(244 244 245);"></div>
      <div class="label">zinc-100</div>
      <div class="value">rgb(244 244 245)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(212 212 216);"></div>
      <div class="label">zinc-300</div>
      <div class="value">rgb(212 212 216)</div>
    </div>
    <div class="swatch">
      <div class="color" style="background: rgb(161 161 170);"></div>
      <div class="label">zinc-400</div>
      <div class="value">rgb(161 161 170)</div>
    </div>
  </div>
</body>
</html>
