<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hatches-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1"></stop>
    </linearGradient>
    <pattern id="hatches-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"></line>
    </pattern>
  </defs>
  
  
  <g transform="translate(400, 400)">
    
    <rect x="-140" y="-180" width="70" height="360" fill="url(#hatches-gradient)"></rect>
    
    
    <rect x="70" y="-180" width="70" height="360" fill="url(#hatches-gradient)"></rect>
    
    
    <rect x="-140" y="-35" width="280" height="70" fill="url(#hatches-gradient)"></rect>
    
    
    <rect x="-140" y="-180" width="280" height="360" fill="url(#hatches-pattern)" opacity="0.3"></rect>
  </g>
</svg>